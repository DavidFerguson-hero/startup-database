    <path d="M -26 55 L -26 -10 L -48 65 Z" fill="#0050D8"/>
    <path d="M 26 55 L 26 -10 L 48 65 Z" fill="#0050D8"/>
    <rect x="-26" y="-75" width="52" height="145" rx="8" fill="#ffffff"/>
    <ellipse cx="0" cy="-75" rx="26" ry="52" fill="#ffffff"/>
    <path d="M -26 -75 Q -10 -148 0 -155 Q 10 -148 26 -75 Z" fill="#ffffff"/>
    <path d="M -26 -75 Q -10 -148 0 -155 Q 10 -148 26 -75 Z" fill="#0050D8" opacity="0.18"/>
    <circle cx="0" cy="-28" r="17" fill="#001F5A"/>
    <circle cx="0" cy="-28" r="13" fill="#1A3A8F"/>
    <circle cx="-5" cy="-33" r="4" fill="#ffffff" opacity="0.45"/>
