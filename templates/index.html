<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Startups Database — EDF UK</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
/* ── EDF 2020 font ── */
@font-face { font-family: "EDF 2020"; font-style: normal; font-weight: 200; font-display: swap; src: url("/static/fonts/EDF2020-ExtraLight.otf") format("opentype"); }
@font-face { font-family: "EDF 2020"; font-style: normal; font-weight: 300; font-display: swap; src: url("/static/fonts/EDF2020-Light.otf") format("opentype"); }
@font-face { font-family: "EDF 2020"; font-style: italic; font-weight: 300; font-display: swap; src: url("/static/fonts/EDF2020-LightItalic.otf") format("opentype"); }
@font-face { font-family: "EDF 2020"; font-style: normal; font-weight: 400; font-display: swap; src: url("/static/fonts/EDF2020.otf") format("opentype"); }
@font-face { font-family: "EDF 2020"; font-style: italic; font-weight: 400; font-display: swap; src: url("/static/fonts/EDF2020-Italic.otf") format("opentype"); }
@font-face { font-family: "EDF 2020"; font-style: normal; font-weight: 700; font-display: swap; src: url("/static/fonts/EDF2020-Bold.otf") format("opentype"); }
@font-face { font-family: "EDF 2020"; font-style: normal; font-weight: 800; font-display: swap; src: url("/static/fonts/EDF2020-ExtraBold.otf") format("opentype"); }

/* ── Design tokens ── */
:root {
  --edf-orange-deep: #FE5716;
  --edf-orange-medium: #FF861D;
  --edf-orange-light: #FFB210;
  --edf-blue-deep: #10367A;
  --edf-blue-medium: #1057C8;
  --edf-blue-light: #1089FF;
  --edf-green-deep: #4F9E30;
  --edf-digital-orange: #CB2C00;
  --edf-black: #000000;
  --edf-white: #FFFFFF;
  --edf-grey-100: #F5F5F5;
  --edf-grey-200: #E5E5E5;
  --edf-grey-300: #D4D4D4;
  --edf-grey-500: #767676;
  --edf-grey-700: #3D3D3D;
  --edf-grey-800: #2A2A2A;
  --font-display: "EDF 2020", "Open Sans", Arial, sans-serif;
  --font-body: "Open Sans", "EDF 2020", Arial, sans-serif;
  --shadow-sm: 0 1px 2px rgba(16,54,122,.08);
  --shadow-md: 0 4px 12px rgba(16,54,122,.10);
  --shadow-lg: 0 12px 32px rgba(16,54,122,.14);
  --shadow-xl: 0 24px 56px rgba(16,54,122,.18);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; }
body { margin: 0; font-family: var(--font-body); background: var(--edf-grey-100); color: var(--edf-black); min-height: 100vh; font-size: 13px; }
button, input, select, textarea { font-family: inherit; }
button { cursor: pointer; }

/* ── Loading ── */
.loading-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; gap: 16px; }
.loading-spinner { width: 28px; height: 28px; border: 3px solid var(--edf-grey-200); border-top-color: var(--edf-orange-deep); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ══════ NAV ══════ */
.app-nav {
  height: 56px; padding: 0 20px;
  display: flex; align-items: center; gap: 18px;
  background: var(--edf-white);
  border-bottom: 1px solid var(--edf-grey-200);
  position: sticky; top: 0; z-index: 30;
}
.nav-logo img { height: 28px; display: block; }
.nav-sep { width: 1px; height: 24px; background: var(--edf-grey-200); flex-shrink: 0; }
.nav-product {
  font-family: var(--font-display); font-weight: 700;
  text-transform: uppercase; font-size: 14px;
  letter-spacing: 0.4px; color: var(--edf-blue-deep);
  white-space: nowrap;
}
.nav-mid { display: flex; gap: 2px; margin-left: 10px; }
.nav-mid button {
  background: transparent; border: 0;
  padding: 7px 13px; border-radius: 999px;
  font-weight: 600; font-size: 13px; color: var(--edf-grey-700);
}
.nav-mid button:hover { background: var(--edf-grey-100); color: var(--edf-black); }
.nav-mid button.active { background: var(--edf-black); color: var(--edf-white); }
.nav-r { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.nav-search-pill {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--edf-grey-100); border: 1px solid var(--edf-grey-200);
  border-radius: 999px; padding: 6px 12px;
  font-size: 12px; color: var(--edf-grey-500); width: 220px; cursor: pointer;
}
.nav-search-pill kbd { margin-left: auto; background: var(--edf-white); border: 1px solid var(--edf-grey-200); border-radius: 4px; padding: 1px 5px; font: inherit; font-size: 10px; }
.nav-add {
  background: var(--edf-black); color: var(--edf-white);
  border: 0; padding: 7px 14px; border-radius: 999px;
  font-weight: 600; font-size: 12px; display: inline-flex; align-items: center; gap: 6px;
}
.nav-add:hover { background: var(--edf-grey-800); }
.nav-acct {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--edf-blue-deep); color: var(--edf-white);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 12px; text-decoration: none;
  border: 0;
}

/* ══════ DENSE STAT STRIPE ══════ */
.stripe {
  background: var(--edf-black); color: var(--edf-white);
  display: grid; grid-template-columns: repeat(8, 1fr);
  border-bottom: 1px solid #222;
}
.stripe-cell {
  padding: 13px 16px;
  border-right: 1px solid #2A2A2A;
  display: flex; flex-direction: column; gap: 3px;
}
.stripe-cell:last-child { border-right: 0; }
.stripe-cell .sc-lbl {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px;
  color: rgba(255,255,255,0.5); font-weight: 600;
}
.stripe-cell .sc-val {
  font-family: var(--font-display); font-weight: 700;
  font-size: 26px; line-height: 1; letter-spacing: -0.5px;
  color: var(--edf-white);
}
.stripe-cell.accent .sc-val { color: var(--edf-orange-deep); }

/* ══════ MAIN GRID ══════ */
.cc-grid {
  display: grid;
  grid-template-columns: 248px 1fr;
  min-height: calc(100vh - 56px - 28px);
}

/* ══════ LEFT RAIL ══════ */
.rail {
  background: var(--edf-white);
  border-right: 1px solid var(--edf-grey-200);
  padding: 14px 12px;
  display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto;
  position: sticky; top: 56px; align-self: start;
  height: calc(100vh - 56px - 28px);
}
.rail-me {
  display: flex; align-items: center; gap: 10px;
  padding: 4px 4px 6px;
  border-bottom: 1px solid var(--edf-grey-200);
}
.rail-me .ava {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--edf-blue-deep); color: var(--edf-white);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px; flex-shrink: 0;
}
.rail-me .nm { font-weight: 700; font-size: 13px; line-height: 1.2; }
.rail-me .rl { font-size: 10px; color: var(--edf-grey-500); }
.rail-me-signout {
  margin-left: auto; background: none; border: none;
  color: var(--edf-grey-500); font-size: 10px; padding: 0;
  text-decoration: none; white-space: nowrap;
}
.rail-me-signout:hover { color: var(--edf-orange-deep); }

.rail-section { display: flex; flex-direction: column; }
.rail-h {
  font-family: var(--font-display); font-weight: 700;
  text-transform: uppercase; font-size: 10px; letter-spacing: 0.7px;
  color: var(--edf-grey-500); margin: 0 4px 5px;
}
.rail-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border-radius: 6px;
  font-size: 12px; color: var(--edf-grey-800);
  border: 0; background: transparent; width: 100%; text-align: left;
}
.rail-item:hover { background: var(--edf-grey-100); }
.rail-item.active { background: var(--edf-black); color: var(--edf-white); font-weight: 600; }
.rail-item.active .ri-count { background: rgba(255,255,255,.18); color: #fff; }
.ri-icon {
  width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700;
}
.ri-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ri-count {
  background: var(--edf-grey-200); color: var(--edf-grey-700);
  font-size: 10px; font-weight: 700;
  padding: 1px 6px; border-radius: 999px; flex-shrink: 0;
}
.rail-recent-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 8px; border-radius: 6px;
  background: transparent; border: 0; width: 100%; text-align: left;
}
.rail-recent-btn:hover { background: var(--edf-grey-100); cursor: pointer; }
.rr-name { font-size: 12px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rr-time { font-size: 10px; color: var(--edf-grey-500); flex-shrink: 0; }

/* ══════ MAIN CONTENT ══════ */
.cc-main { background: var(--edf-grey-100); min-width: 0; display: flex; flex-direction: column; }

/* ══════ TOOLBAR ══════ */
.toolbar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 11px 18px; background: var(--edf-white);
  border-bottom: 1px solid var(--edf-grey-200);
  position: sticky; top: 56px; z-index: 10;
}
.tb-view {
  font-family: var(--font-display); font-weight: 700;
  text-transform: uppercase; font-size: 15px;
  color: var(--edf-blue-deep); letter-spacing: 0.3px;
  white-space: nowrap;
}
.tb-view .star { color: var(--edf-orange-deep); margin-right: 3px; }
.tb-count { font-size: 11px; color: var(--edf-grey-500); white-space: nowrap; }
.search-pill {
  flex: 1; max-width: 360px; margin-left: 10px;
  display: flex; align-items: center; gap: 8px;
  background: var(--edf-grey-100); border: 1px solid var(--edf-grey-200);
  padding: 7px 13px; border-radius: 999px; color: var(--edf-grey-500);
}
.search-pill input { border: 0; outline: 0; background: transparent; flex: 1; font-size: 12px; color: var(--edf-black); min-width: 0; }
.filter-chip {
  background: var(--edf-white); border: 1px solid var(--edf-grey-200);
  padding: 5px 11px; border-radius: 999px;
  font-size: 11px; font-weight: 600; color: var(--edf-grey-800);
  display: inline-flex; align-items: center; gap: 4px; position: relative;
  white-space: nowrap;
}
.filter-chip:hover { border-color: var(--edf-black); }
.filter-chip.has { background: var(--edf-orange-deep); border-color: var(--edf-orange-deep); color: #fff; }
.fc-badge {
  background: rgba(255,255,255,0.3); color: #fff;
  font-size: 9px; font-weight: 700; padding: 0 4px; border-radius: 999px;
}
.fm-pop {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 50;
  background: var(--edf-white); border: 1px solid var(--edf-grey-200);
  border-radius: 8px; box-shadow: var(--shadow-lg);
  min-width: 180px; max-height: 280px; overflow-y: auto; padding: 6px;
}
.fm-opt {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border-radius: 5px; cursor: pointer;
  font-size: 12px; user-select: none;
}
.fm-opt:hover { background: var(--edf-grey-100); }
.fm-opt input { width: 13px; height: 13px; accent-color: var(--edf-orange-deep); }
.fm-scrim { position: fixed; inset: 0; z-index: 40; }
.tb-clear {
  background: transparent; border: 0;
  font-size: 11px; font-weight: 600; color: var(--edf-grey-500);
  padding: 5px 8px; border-radius: 999px;
}
.tb-clear:hover { background: var(--edf-grey-100); color: var(--edf-black); }
.tb-export {
  background: transparent; border: 1px solid var(--edf-grey-200);
  padding: 5px 11px; border-radius: 999px;
  font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px;
  margin-left: auto; white-space: nowrap;
}
.tb-export:hover { border-color: var(--edf-black); }

/* ══════ DENSE TABLE ══════ */
.table-wrap { background: var(--edf-white); flex: 1; overflow-x: auto; }
table.dense {
  width: 100%; border-collapse: collapse; font-size: 12px;
  table-layout: fixed;
}
table.dense th {
  text-align: left; font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.6px;
  color: var(--edf-grey-500); padding: 9px 10px;
  background: var(--edf-grey-100);
  border-bottom: 1px solid var(--edf-grey-200);
  white-space: nowrap; cursor: pointer; user-select: none;
}
table.dense th.sorted { color: var(--edf-black); }
table.dense th:hover { color: var(--edf-black); }
table.dense td { padding: 7px 10px; border-bottom: 1px solid #F0F0F0; vertical-align: middle; }
table.dense th:first-child, table.dense td:first-child { padding-left: 18px; }
table.dense th:last-child, table.dense td:last-child { padding-right: 18px; }
.trow { cursor: pointer; }
.trow:hover td { background: #FFF8F2; }
.trow.selected td { background: #FFE4D6; }
.t-co { display: flex; align-items: center; gap: 8px; min-width: 0; }
.t-nm { font-weight: 700; font-size: 12px; line-height: 1.2; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t-cat { font-size: 10px; color: var(--edf-grey-500); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t-mute { color: var(--edf-grey-500); }
.t-flag {
  font-size: 9px; font-weight: 700; letter-spacing: 0.5px;
  padding: 2px 5px; border-radius: 3px; display: inline-block;
}
.t-flag.pv { background: #FFE4D6; color: #B8350D; }
.t-flag.nda { background: #DCEAFF; color: var(--edf-blue-deep); }
.t-flag.av { background: #2A2A2A; color: #fff; }
.theme-tag {
  display: inline-block; font-size: 10px; font-weight: 600;
  color: var(--edf-grey-700); background: var(--edf-grey-100);
  padding: 2px 6px; border-radius: 3px; white-space: nowrap;
}

/* Status pills — real status values */
.status-pill {
  display: inline-flex; align-items: center; gap: 4px;
  font-weight: 600; font-size: 10px; letter-spacing: 0.3px;
  padding: 2px 8px; border-radius: 999px;
  white-space: nowrap;
}
.status-pill::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

/* ══════ FOOTER ══════ */
.app-footer {
  height: 28px;
  display: flex; align-items: center; gap: 16px;
  padding: 0 18px; background: var(--edf-black); color: rgba(255,255,255,.6);
  font-size: 11px; letter-spacing: 0.3px; position: sticky; bottom: 0; z-index: 20;
}
.ftr-live::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #88D910; margin-right: 6px; vertical-align: 1px; }
.ftr-sep { width: 1px; height: 12px; background: rgba(255,255,255,.18); }

/* ══════ DETAIL DRAWER ══════ */
.drawer-scrim { position: fixed; inset: 0; background: rgba(16,54,122,.35); z-index: 40; backdrop-filter: blur(2px); }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: 520px; max-width: 94vw;
  background: var(--edf-white); z-index: 50;
  box-shadow: var(--shadow-xl); overflow-y: auto;
  animation: slideIn 0.22s ease-out;
}
@keyframes slideIn { from { transform: translateX(100%); } }
.dr-head { padding: 20px 22px 14px; border-bottom: 1px solid var(--edf-grey-200); position: relative; }
.dr-close {
  position: absolute; top: 14px; right: 14px;
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--edf-grey-100); border: 0;
  display: flex; align-items: center; justify-content: center; font-size: 14px;
}
.dr-close:hover { background: var(--edf-grey-200); }
.dr-top { display: flex; gap: 14px; align-items: center; }
.dr-name { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; font-size: 24px; line-height: 1; margin: 0; color: var(--edf-blue-deep); }
.dr-sub { font-size: 12px; color: var(--edf-grey-500); margin-top: 4px; }
.dr-pills { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.dr-body { padding: 16px 22px 28px; }
.dr-desc { font-size: 13px; line-height: 1.55; color: var(--edf-grey-800); margin: 0 0 16px; }
.dr-status-comment { font-size: 12px; font-style: italic; color: var(--edf-grey-700); margin: -8px 0 14px; padding-left: 10px; border-left: 3px solid var(--edf-orange-deep); }
.dr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; padding: 13px 16px; background: var(--edf-grey-100); border-radius: 8px; margin-bottom: 16px; }
.dr-grid dt { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--edf-grey-500); margin: 0; }
.dr-grid dd { margin: 3px 0 0; font-size: 13px; font-weight: 600; word-break: break-word; }
.dr-grid a { color: var(--edf-blue-medium); text-decoration: none; }
.dr-grid a:hover { text-decoration: underline; }
.dr-h3 { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; color: var(--edf-grey-700); margin: 0 0 8px; }
.dr-contact { display: flex; gap: 10px; align-items: center; background: var(--edf-grey-100); padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; }
.dr-c-av { width: 34px; height: 34px; border-radius: 50%; background: var(--edf-blue-deep); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; flex-shrink: 0; }
.dr-c-nm { font-weight: 700; font-size: 13px; }
.dr-c-em { font-size: 11px; color: var(--edf-grey-500); }
.dr-c-cta { margin-left: auto; background: var(--edf-black); color: #fff; border: 0; padding: 6px 12px; border-radius: 999px; font-size: 11px; font-weight: 600; text-decoration: none; flex-shrink: 0; }
.dr-c-cta:hover { background: var(--edf-grey-800); }

.dr-note-input {
  width: 100%; border: 1px solid var(--edf-grey-200); border-radius: 8px;
  padding: 10px 12px; font-size: 12px; resize: vertical; min-height: 70px;
  outline: none; background: var(--edf-grey-100);
}
.dr-note-input:focus { border-color: var(--edf-blue-medium); background: var(--edf-white); }
.dr-note-actions { display: flex; justify-content: flex-end; margin-top: 6px; margin-bottom: 14px; gap: 8px; }
.dr-timeline { list-style: none; padding: 0; margin: 0 0 16px; }
.dr-timeline li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--edf-grey-200); font-size: 12px; }
.tl-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--edf-orange-deep); flex-shrink: 0; margin-top: 4px; }
.dr-note-meta { font-size: 10px; color: var(--edf-grey-500); margin-top: 3px; }
.dr-actions { display: flex; gap: 8px; margin-top: 16px; align-items: center; }
.status-select {
  flex: 1; border: 1px solid var(--edf-grey-200); border-radius: 999px;
  padding: 7px 12px; font-size: 12px; font-weight: 600; background: var(--edf-grey-100);
  outline: none; cursor: pointer;
}
.status-select:focus { border-color: var(--edf-blue-medium); }

/* ══════ BUTTONS ══════ */
.btn-primary {
  background: var(--edf-black); color: var(--edf-white);
  border: 0; padding: 8px 18px; border-radius: 999px;
  font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; gap: 6px;
}
.btn-primary:hover { background: var(--edf-grey-800); }
.btn-ghost {
  background: transparent; border: 1.5px solid var(--edf-grey-200);
  padding: 8px 18px; border-radius: 999px;
  font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px;
}
.btn-ghost:hover { border-color: var(--edf-black); }
.btn-sm {
  padding: 6px 12px; font-size: 12px;
}

/* ══════ ADD/EDIT VENTURE MODAL ══════ */
.modal-scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 60; display: flex; align-items: flex-start; justify-content: center; padding: 40px 20px; overflow-y: auto; }
.modal-card {
  background: var(--edf-white); border-radius: 16px; width: 100%; max-width: 640px;
  box-shadow: var(--shadow-xl); position: relative;
}
.modal-head {
  padding: 24px 28px 16px; border-bottom: 1px solid var(--edf-grey-200);
}
.modal-head h2 { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; font-size: 22px; margin: 0 0 4px; color: var(--edf-blue-deep); }
.modal-head p { font-size: 13px; color: var(--edf-grey-500); margin: 0; }
.modal-close { position: absolute; top: 16px; right: 16px; width: 30px; height: 30px; border-radius: 50%; background: var(--edf-grey-100); border: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.modal-close:hover { background: var(--edf-grey-200); }
.modal-body { padding: 20px 28px 24px; display: flex; flex-direction: column; gap: 20px; }
.form-section-title { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: 0.6px; color: var(--edf-grey-500); margin-bottom: 10px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
.form-grid label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 600; color: var(--edf-grey-700); }
.form-grid label.full { grid-column: 1/-1; }
.form-grid input, .form-grid select, .form-grid textarea {
  border: 1px solid var(--edf-grey-200); border-radius: 8px;
  padding: 8px 10px; font-size: 12px; outline: none; background: var(--edf-grey-100);
}
.form-grid input:focus, .form-grid select:focus, .form-grid textarea:focus { border-color: var(--edf-blue-medium); background: var(--edf-white); }
.form-grid input:disabled { background: var(--edf-grey-200); cursor: not-allowed; }
.chk-row { display: flex; flex-wrap: wrap; gap: 8px; }
.chk { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 6px 10px; border: 1px solid var(--edf-grey-200); border-radius: 6px; cursor: pointer; user-select: none; }
.chk:hover { border-color: var(--edf-black); }
.chk input { accent-color: var(--edf-orange-deep); }
.form-msg { padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; }
.form-success { background: #DDF4D2; color: #2F6420; }
.form-error { background: #FFE4D6; color: #B8350D; }
.modal-actions { padding: 16px 28px 24px; display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid var(--edf-grey-200); }

/* ══════ SCROLLBARS ══════ */
.rail::-webkit-scrollbar, .table-wrap::-webkit-scrollbar, .drawer::-webkit-scrollbar { width: 6px; height: 6px; }
.rail::-webkit-scrollbar-thumb, .table-wrap::-webkit-scrollbar-thumb, .drawer::-webkit-scrollbar-thumb { background: var(--edf-grey-200); border-radius: 4px; }

/* ══════ EMPTY STATE ══════ */
.empty-state { padding: 40px; text-align: center; color: var(--edf-grey-500); font-size: 13px; font-style: italic; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
{% raw %}
const { useState, useEffect, useMemo, useCallback, useRef } = React;

// ─── Real status values ──────────────────────────────────────────
const REAL_STATUSES = ['No contact','Met but no live discussions','Early Exploration','Advanced discussions','Live collaboration'];

const STATUS_STYLE = {
  'No contact':                  { bg: '#EEEEEE', color: '#555555' },
  'Met but no live discussions': { bg: '#E0E0E0', color: '#3A3A3A' },
  'Early Exploration':           { bg: '#DCEAFF', color: '#10367A' },
  'Advanced discussions':        { bg: '#DDF4D2', color: '#2F6420' },
  'Live collaboration':          { bg: '#FFD9C2', color: '#7A2A05' },
};

const THEME_COLORS = {
  'Energy Storage & Flexibility': '#1057C8',
  'Renewables':                   '#FE5716',
  'Buildings & Cities':           '#FF861D',
  'Environment & Sustainability': '#4F9E30',
  'Nuclear & Deep Tech':          '#10367A',
  'Hydrogen & Fuels':             '#1089FF',
  'Industry & Manufacturing':     '#FFB210',
  'AI & Digital':                 '#4F9E30',
  'Energy (General)':             '#10367A',
  'Services':                     '#767676',
  'Uncategorised':                '#767676',
};

const BU_OPTIONS = ['Nuclear operations','Nuclear Services','Dalkia','BWS','Retail','EDF Heat Pumps','Contact Solar','Hynamics','R&D','EDF Power Solutions','Pod'];

// ─── Portfolio colour palette (cycles for user-created ones) ─────
const COL_PALETTE = ['#FE5716','#10367A','#4F9E30','#FF861D','#1057C8','#1089FF','#FFB210','#2A2A2A'];
function portfolioColor(name, idx) {
  return COL_PALETTE[idx % COL_PALETTE.length];
}
function portfolioLetter(name) {
  return name.replace(/[^A-Za-z]/g,'')[0]?.toUpperCase() || '#';
}

// ─── Normalizer ──────────────────────────────────────────────────
function normalizeStartup(s) {
  const lastTouch = s.updates && s.updates.length > 0 ? s.updates[0].date : '';
  return {
    id: s.name,
    name: s.name,
    theme: s.theme || 'Uncategorised',
    category: s.primary_category || s.category || 'Uncategorised',
    bu: s.business_unit ? s.business_unit.split(', ').filter(Boolean) : [],
    status: s.status || 'No contact',
    country: s.country || '—',
    desc: s.description || '',
    contact: s.key_contact || '—',
    contactEmail: s.key_contact_email || '',
    relOwner: s.relationship_owner || '—',
    website: s.website || '',
    portfolio: s.edf_pv === 'Yes',
    nda: s.nda === 'Yes',
    avoid: s.avoid === 'Yes',
    addedBy: s.added_by || '—',
    lastTouch,
    updates: s.updates || [],
    statusComment: s.status_comment || '',
    hasFolder: s.has_folder || false,
  };
}

// ─── Icons ──────────────────────────────────────────────────────
const I = ({ d, size = 16, sw = 1.5 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
       strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">{d}</svg>
);
const IcoSearch   = p => <I {...p} d={<><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></>}/>;
const IcoX        = p => <I {...p} d={<><path d="M6 6l12 12M18 6 6 18"/></>}/>;
const IcoPlus     = p => <I {...p} d={<><path d="M12 5v14M5 12h14"/></>}/>;
const IcoBolt     = p => <I {...p} d={<><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></>}/>;
const IcoChevD    = p => <I {...p} d={<><path d="m6 9 6 6 6-6"/></>}/>;
const IcoDownload = p => <I {...p} d={<><path d="M12 3v13M6 12l6 5 6-5M4 21h16"/></>}/>;
const IcoTrash    = p => <I {...p} d={<><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></>}/>;
const IcoArrowUR  = p => <I {...p} d={<><path d="M7 17 17 7M8 7h9v9"/></>}/>;
const IcoExternal = p => <I {...p} d={<><path d="M14 3h7v7M21 3l-9 9M5 5h6v0a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></>}/>;

// ─── Utilities ──────────────────────────────────────────────────
function relDate(s) {
  if (!s) return '—';
  const d = new Date(s), now = new Date();
  const days = Math.floor((now - d) / 86400000);
  if (days < 1) return 'today';
  if (days < 7) return `${days}d`;
  if (days < 30) return `${Math.floor(days/7)}w`;
  if (days < 365) return `${Math.floor(days/30)}mo`;
  return `${Math.floor(days/365)}y`;
}
function fmtDate(s) {
  if (!s) return '—';
  return new Date(s).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}
function todayISO() { return new Date().toISOString().split('T')[0]; }
function mkInitials(name) { return name.replace(/[^A-Za-z ]/g,'').split(/\s+/).slice(0,2).map(s=>s[0]).join('').toUpperCase(); }

// ─── EDF Logo ───────────────────────────────────────────────────
function EdfLogo({ height = 28 }) {
  return <img src="/static/edf-logo.png" alt="EDF" style={{ height, width: 'auto', display: 'block' }}/>;
}

// ─── Startup mark ───────────────────────────────────────────────
function StartupMark({ name, theme, size = 22 }) {
  const bg = THEME_COLORS[theme] || '#10367A';
  const initials = mkInitials(name);
  return (
    <div style={{
      width: size, height: size, borderRadius: 5, background: bg, color: '#fff',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: 'EDF 2020, Open Sans, Arial', fontWeight: 700,
      fontSize: Math.max(7, size * 0.38), flexShrink: 0, letterSpacing: 0.3,
    }}>{initials}</div>
  );
}

// ─── Status pill ────────────────────────────────────────────────
function StatusPill({ status }) {
  const st = STATUS_STYLE[status] || { bg: '#EEEEEE', color: '#555' };
  return (
    <span className="status-pill" style={{ background: st.bg, color: st.color }}>
      {status}
    </span>
  );
}

// ─── Stat Stripe ─────────────────────────────────────────────────
function StatStripe({ startups }) {
  const stats = useMemo(() => {
    const total = startups.length;
    const bySt = REAL_STATUSES.reduce((a,s) => { a[s] = startups.filter(x => x.status === s).length; return a; }, {});
    const pv = startups.filter(s => s.portfolio).length;
    const countries = new Set(startups.map(s => s.country).filter(c => c && c !== '—')).size;
    // avg last touch in days
    const touched = startups.filter(s => s.lastTouch);
    let avgDays = 0;
    if (touched.length) {
      const now = new Date();
      const sum = touched.reduce((a,s) => a + Math.floor((now - new Date(s.lastTouch)) / 86400000), 0);
      avgDays = Math.round(sum / touched.length);
    }
    return { total, bySt, pv, countries, avgDays };
  }, [startups]);

  const cells = [
    { label: 'Total ventures',        val: stats.total,                                     accent: true },
    { label: 'No contact',            val: stats.bySt['No contact'] || 0 },
    { label: 'Early exploration',     val: stats.bySt['Early Exploration'] || 0 },
    { label: 'Advanced discussions',  val: stats.bySt['Advanced discussions'] || 0 },
    { label: 'Live collaboration',    val: stats.bySt['Live collaboration'] || 0,            accent: true },
    { label: 'EDF PV portfolio',      val: stats.pv },
    { label: 'Countries',             val: stats.countries },
    { label: 'Avg. last touch',       val: stats.avgDays ? `${stats.avgDays}d` : '—' },
  ];

  return (
    <div className="stripe">
      {cells.map(c => (
        <div key={c.label} className={`stripe-cell${c.accent ? ' accent' : ''}`}>
          <div className="sc-lbl">{c.label}</div>
          <div className="sc-val">{c.val}</div>
        </div>
      ))}
    </div>
  );
}

// ─── Left Rail ──────────────────────────────────────────────────
function LeftRail({ startups, collections, activeView, setActiveView, onPick, onAddClick, onNewPortfolio, onManagePortfolio }) {
  const recents = useMemo(() => (
    [...startups].filter(s => s.lastTouch).sort((a,b) => b.lastTouch.localeCompare(a.lastTouch)).slice(0,6)
  ), [startups]);

  const colEntries = Object.entries(collections);

  return (
    <aside className="rail">
      <div className="rail-me">
        <div className="ava">EDF</div>
        <div>
          <div className="nm">EDF Scouting</div>
          <div className="rl">Innovation team</div>
        </div>
        <a href="/logout" className="rail-me-signout">Sign out</a>
      </div>

      <div className="rail-section">
        <div className="rail-h" style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
          <span>Portfolios</span>
          <button onClick={onNewPortfolio} title="New portfolio"
            style={{ background:'none', border:'none', color:'var(--edf-grey-500)', fontSize:16, padding:'0 2px', lineHeight:1, cursor:'pointer' }}
            onMouseEnter={e=>e.currentTarget.style.color='var(--edf-orange-deep)'}
            onMouseLeave={e=>e.currentTarget.style.color='var(--edf-grey-500)'}>+</button>
        </div>

        <button
          className={`rail-item${activeView === 'all' ? ' active' : ''}`}
          onClick={() => setActiveView('all')}
        >
          <span className="ri-icon" style={{ background: '#767676', color: '#fff' }}>≡</span>
          <span className="ri-name">Whole database</span>
          <span className="ri-count">{startups.length}</span>
        </button>

        {colEntries.map(([name, col], idx) => {
          const members = col.startups || [];
          const color = portfolioColor(name, idx);
          return (
            <div key={name} style={{ display:'flex', alignItems:'center', gap:2 }}>
              <button
                className={`rail-item${activeView === name ? ' active' : ''}`}
                style={{ flex:1 }}
                onClick={() => setActiveView(name)}
              >
                <span className="ri-icon" style={{ background: color, color: '#fff', flexShrink:0 }}>{portfolioLetter(name)}</span>
                <span className="ri-name">{name}</span>
                <span className="ri-count">{members.length}</span>
              </button>
              <button
                onClick={() => onManagePortfolio(name)}
                title="Manage portfolio"
                style={{ background:'none', border:'none', color:'var(--edf-grey-300)', padding:'4px 3px', cursor:'pointer', flexShrink:0, fontSize:13 }}
                onMouseEnter={e=>e.currentTarget.style.color='var(--edf-grey-700)'}
                onMouseLeave={e=>e.currentTarget.style.color='var(--edf-grey-300)'}>⋯</button>
            </div>
          );
        })}

        {colEntries.length === 0 && (
          <div style={{ fontSize:11, color:'var(--edf-grey-500)', padding:'4px 8px', fontStyle:'italic' }}>
            No portfolios yet — click + to create one.
          </div>
        )}
      </div>

      <div className="rail-section">
        <div className="rail-h">Recents</div>
        {recents.map(s => (
          <button key={s.id} className="rail-recent-btn" onClick={() => onPick(s)}>
            <StartupMark name={s.name} theme={s.theme} size={20}/>
            <span className="rr-name">{s.name}</span>
            <span className="rr-time">{relDate(s.lastTouch)}</span>
          </button>
        ))}
        {recents.length === 0 && <div style={{ fontSize: 11, color: 'var(--edf-grey-500)', padding: '4px 8px' }}>No activity yet.</div>}
      </div>
    </aside>
  );
}

// ─── Filter menu ────────────────────────────────────────────────
function FilterMenu({ label, options, active, onChange }) {
  const [open, setOpen] = useState(false);
  const toggle = o => onChange(active.includes(o) ? active.filter(x => x !== o) : [...active, o]);
  return (
    <div style={{ position: 'relative' }}>
      <button className={`filter-chip${active.length ? ' has' : ''}`} onClick={() => setOpen(!open)}>
        {label}
        {active.length > 0 && <span className="fc-badge">{active.length}</span>}
        <IcoChevD size={10}/>
      </button>
      {open && (
        <>
          <div className="fm-scrim" onClick={() => setOpen(false)}/>
          <div className="fm-pop">
            {options.map(o => (
              <label key={o} className="fm-opt">
                <input type="checkbox" checked={active.includes(o)} onChange={() => toggle(o)}/>
                {o}
              </label>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

// ─── Toolbar ────────────────────────────────────────────────────
function Toolbar({ q, setQ, filters, setFilters, viewName, count, allThemes, allCountries, onAddClick }) {
  const anyFilter = Object.values(filters).some(v => v.length > 0);
  const clear = () => setFilters({ status: [], theme: [], bu: [], country: [] });

  return (
    <div className="toolbar">
      <div style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
        <span className="tb-view"><span className="star">★</span> {viewName}</span>
        <span className="tb-count">{count} ventures</span>
      </div>
      <div className="search-pill">
        <IcoSearch size={13}/>
        <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search name, category, description…"/>
      </div>
      <FilterMenu label="Status"  options={REAL_STATUSES} active={filters.status}  onChange={v => setFilters({...filters, status: v})}/>
      <FilterMenu label="Theme"   options={allThemes}     active={filters.theme}   onChange={v => setFilters({...filters, theme: v})}/>
      <FilterMenu label="BU"      options={BU_OPTIONS}    active={filters.bu}      onChange={v => setFilters({...filters, bu: v})}/>
      <FilterMenu label="Country" options={allCountries}  active={filters.country} onChange={v => setFilters({...filters, country: v})}/>
      {anyFilter && <button className="tb-clear" onClick={clear}>Clear</button>}
      <button className="tb-export" onClick={() => window.location.href='/api/startups'}>
        <IcoDownload size={12}/> CSV
      </button>
    </div>
  );
}

// ─── Dense Table ────────────────────────────────────────────────
function DenseTable({ data, picked, onPick, sortBy, setSortBy }) {
  const cols = [
    { k: 'name',      l: 'Company',     w: '22%' },
    { k: 'status',    l: 'Status',      w: '10%' },
    { k: 'theme',     l: 'Theme',       w: '9%' },
    { k: 'country',   l: 'Country',     w: '6%' },
    { k: 'bu',        l: 'BU',          w: '11%' },
    { k: 'relOwner',  l: 'Owner',       w: '9%' },
    { k: 'lastTouch', l: 'Last touch',  w: '7%' },
    { k: 'flags',     l: 'Flags',       w: '6%', noSort: true },
    { k: '_arrow',    l: '',            w: '3%', noSort: true },
  ];

  return (
    <div className="table-wrap">
      <table className="dense">
        <colgroup>{cols.map(c => <col key={c.k} style={{ width: c.w }}/>)}</colgroup>
        <thead>
          <tr>
            {cols.map(c => (
              <th key={c.k}
                  className={sortBy === c.k ? 'sorted' : ''}
                  onClick={() => !c.noSort && setSortBy(c.k)}
                  style={{ cursor: c.noSort ? 'default' : 'pointer' }}>
                {c.l}{sortBy === c.k ? ' ↓' : ''}
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {data.map(s => (
            <tr key={s.id} className={`trow${picked && picked.id === s.id ? ' selected' : ''}`} onClick={() => onPick(s)}>
              <td>
                <div className="t-co">
                  <StartupMark name={s.name} theme={s.theme} size={22}/>
                  <div style={{ minWidth: 0 }}>
                    <div className="t-nm">{s.name}</div>
                    <div className="t-cat">{s.category}</div>
                  </div>
                </div>
              </td>
              <td><StatusPill status={s.status}/></td>
              <td><span className="theme-tag">{s.theme}</span></td>
              <td className="t-mute">{s.country}</td>
              <td style={{ fontSize: 11, color: 'var(--edf-grey-700)' }}>{s.bu.join(' · ') || '—'}</td>
              <td className="t-mute">{s.relOwner !== '—' ? s.relOwner : ''}</td>
              <td className="t-mute">{relDate(s.lastTouch)}</td>
              <td>
                {s.portfolio && <span className="t-flag pv">PV</span>}
                {s.nda && <span className="t-flag nda" style={{ marginLeft: 3 }}>NDA</span>}
                {s.avoid && <span className="t-flag av" style={{ marginLeft: 3 }}>!</span>}
              </td>
              <td className="t-mute" style={{ textAlign: 'right', fontSize: 14 }}>›</td>
            </tr>
          ))}
        </tbody>
      </table>
      {data.length === 0 && <div className="empty-state">No ventures match your filters.</div>}
    </div>
  );
}

// ─── Detail Drawer ──────────────────────────────────────────────
function DetailDrawer({ s, onClose, onStatusChange, collections, onCollectionsChange, onStartupSaved, allStartups, onPick }) {

  // Startups that are similar to this one (AI-linked first, then same-category peers)
  const similarStartups = useMemo(() => {
    if (!allStartups || !s) return [];
    const nameLc = s.name.toLowerCase();
    const aiLinked = allStartups.filter(x =>
      x.id !== s.id &&
      x.addedBy && x.addedBy.toLowerCase().includes('similar to ' + nameLc)
    );
    const catPeers = s.category && s.category !== 'Uncategorised'
      ? allStartups.filter(x =>
          x.id !== s.id &&
          x.category === s.category &&
          !aiLinked.find(a => a.id === x.id)
        ).slice(0, Math.max(0, 5 - aiLinked.length))
      : [];
    return [...aiLinked, ...catPeers].slice(0, 5);
  }, [allStartups, s && s.id]);
  const [noteText, setNoteText]     = useState('');
  const [noteSaving, setNoteSaving] = useState(false);
  const [localUpdates, setLocalUpdates] = useState(null);
  const [colToggles, setColToggles] = useState({});

  // ── Edit mode ──
  const [editing, setEditing]       = useState(false);
  const [form, setForm]             = useState({});
  const [editSaving, setEditSaving] = useState(false);
  const [editMsg, setEditMsg]       = useState(null);

  // ── Find similar (AI) ──
  const [aiTask, setAiTask]         = useState(null); // null | {status:'running'|'done'|'error', result}
  const aiPollRef                   = useRef(null);

  const findSimilar = async () => {
    setAiTask({ status: 'running', result: null });
    try {
      const res = await fetch('/api/ai/find-similar', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: s.name }),
      });
      const j = await res.json();
      if (!j.ok) { setAiTask({ status: 'error', result: { error: j.error || 'Failed to start task' } }); return; }
      const taskId = j.task_id;
      aiPollRef.current = setInterval(async () => {
        try {
          const sr = await fetch(`/api/ai/status/${taskId}`);
          const sj = await sr.json();
          if (sj.status === 'done' || sj.status === 'error') {
            clearInterval(aiPollRef.current); aiPollRef.current = null;
            setAiTask({ status: sj.status, result: sj.result });
            if (sj.status === 'done' && onStartupSaved) onStartupSaved();
          }
        } catch { /* network hiccup — keep polling */ }
      }, 2500);
    } catch (e) { setAiTask({ status: 'error', result: { error: String(e) } }); }
  };

  const updates = localUpdates !== null ? localUpdates : (s ? s.updates : []);

  useEffect(() => {
    setLocalUpdates(null); setNoteText(''); setColToggles({});
    setEditing(false); setEditMsg(null);
    setAiTask(null);
    if (aiPollRef.current) { clearInterval(aiPollRef.current); aiPollRef.current = null; }
  }, [s && s.id]);

  // Cleanup on unmount
  useEffect(() => () => { if (aiPollRef.current) clearInterval(aiPollRef.current); }, []);

  const startEdit = () => {
    setForm({
      name: s.name,
      category: s.category === 'Uncategorised' ? '' : s.category,
      status: s.status,
      status_comment: s.statusComment,
      country: s.country === '—' ? '' : s.country,
      description: s.desc,
      website: s.website,
      added_by: s.addedBy === '—' ? '' : s.addedBy,
      key_contact: s.contact === '—' ? '' : s.contact,
      key_contact_email: s.contactEmail,
      relationship_owner: s.relOwner === '—' ? '' : s.relOwner,
      edf_pv: s.portfolio ? 'Yes' : 'No',
      nda: s.nda ? 'Yes' : 'No',
      avoid: s.avoid ? 'Yes' : 'No',
      business_units: [...s.bu],
    });
    setEditing(true);
    setEditMsg(null);
  };

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const toggleBU = bu => set('business_units',
    form.business_units.includes(bu)
      ? form.business_units.filter(x => x !== bu)
      : [...form.business_units, bu]
  );

  const saveEdit = async () => {
    setEditSaving(true); setEditMsg(null);
    try {
      const res = await fetch('/api/startups/edit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(form),
      });
      const j = await res.json();
      if (j.ok) {
        setEditMsg({ type: 'success', text: 'Saved.' });
        if (onStartupSaved) onStartupSaved();
        setTimeout(() => setEditing(false), 800);
      } else {
        setEditMsg({ type: 'error', text: j.error || 'Could not save.' });
      }
    } catch { setEditMsg({ type: 'error', text: 'Network error.' }); }
    finally { setEditSaving(false); }
  };

  if (!s) return null;

  const cInitials = s.contact && s.contact !== '—' ? s.contact.split(' ').map(p=>p[0]).slice(0,2).join('') : '?';

  const saveNote = async () => {
    if (!noteText.trim()) return;
    setNoteSaving(true);
    try {
      const res = await fetch('/api/update', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: s.name, text: noteText.trim(), date: todayISO() }),
      });
      const j = await res.json();
      if (j.ok) { setLocalUpdates([{ date: todayISO(), text: noteText.trim(), author: null }, ...updates]); setNoteText(''); }
    } finally { setNoteSaving(false); }
  };

  const deleteNote = async (idx) => {
    const res = await fetch('/api/update/delete', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: s.name, index: idx }),
    });
    const j = await res.json();
    if (j.ok) { const next = [...updates]; next.splice(idx, 1); setLocalUpdates(next); }
  };

  const toggleCol = async (colName) => {
    const inCol = (collections[colName]?.startups || []).includes(s.name);
    const url = inCol ? '/api/collections/remove' : '/api/collections/add';
    setColToggles(t => ({ ...t, [colName]: true }));
    const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ collection: colName, startup: s.name }) });
    const j = await res.json();
    if (j.ok) onCollectionsChange();
    setColToggles(t => { const n = {...t}; delete n[colName]; return n; });
  };

  // ── Shared header ──────────────────────────────────────────────
  const drawerHead = (
    <div className="dr-head">
      <div style={{ position:'absolute', top:14, right:14, display:'flex', gap:6 }}>
        {!editing && (() => {
          const aiRunning = aiTask?.status === 'running';
          const aiDone    = aiTask?.status === 'done';
          const aiErr     = aiTask?.status === 'error';
          const addedN    = aiDone ? (aiTask.result?.added || []).length : 0;
          const btnBg     = aiDone ? '#E6F4E1' : aiErr ? '#FDE8E8' : 'var(--edf-grey-100)';
          const btnColor  = aiDone ? '#2F6420' : aiErr ? '#991B1B' : 'var(--edf-grey-800)';
          const btnBorder = aiDone ? '#B7DFA8' : aiErr ? '#FECACA' : 'var(--edf-grey-200)';
          return (
            <button onClick={aiDone || aiErr ? () => setAiTask(null) : findSimilar}
              disabled={aiRunning}
              title={aiErr ? (aiTask.result?.error || 'Error') : aiDone ? (aiTask.result?.added||[]).map(x=>x.name).join(', ') || 'No new startups found' : 'Find 2 similar UK startups and add them to the database'}
              style={{ background: btnBg, border:`1px solid ${btnBorder}`, borderRadius:999,
                padding:'4px 12px', fontSize:11, fontWeight:700, cursor: aiRunning ? 'default' : 'pointer',
                color: btnColor, opacity: aiRunning ? 0.7 : 1, whiteSpace:'nowrap' }}
              onMouseEnter={e=>{ if(!aiRunning && !aiDone && !aiErr){ e.currentTarget.style.background='var(--edf-black)'; e.currentTarget.style.color='#fff'; e.currentTarget.style.borderColor='var(--edf-black)'; }}}
              onMouseLeave={e=>{ e.currentTarget.style.background=btnBg; e.currentTarget.style.color=btnColor; e.currentTarget.style.borderColor=btnBorder; }}>
              {aiRunning ? '⏳ Searching…' : aiDone ? `✓ Added ${addedN}` : aiErr ? '⚠ Error — retry?' : '✦ Find similar'}
            </button>
          );
        })()}
        {!editing && (
          <button onClick={startEdit}
            style={{ background:'var(--edf-grey-100)', border:'1px solid var(--edf-grey-200)', borderRadius:999,
              padding:'4px 12px', fontSize:11, fontWeight:700, cursor:'pointer', color:'var(--edf-grey-800)' }}
            onMouseEnter={e=>{e.currentTarget.style.background='var(--edf-black)';e.currentTarget.style.color='#fff';e.currentTarget.style.borderColor='var(--edf-black)';}}
            onMouseLeave={e=>{e.currentTarget.style.background='var(--edf-grey-100)';e.currentTarget.style.color='var(--edf-grey-800)';e.currentTarget.style.borderColor='var(--edf-grey-200)';}}>
            Edit
          </button>
        )}
        <button className="dr-close" onClick={editing ? () => setEditing(false) : onClose}
          style={{ position:'static' }}>✕</button>
      </div>
      <div className="dr-top">
        <StartupMark name={s.name} theme={s.theme} size={52}/>
        <div>
          <h2 className="dr-name">{s.name}</h2>
          <div className="dr-sub">
            {editing ? 'Editing record' : `${s.category}${s.country && s.country !== '—' ? ` · ${s.country}` : ''}`}
          </div>
        </div>
      </div>
      {!editing && (
        <div className="dr-pills">
          <StatusPill status={s.status}/>
          <span className="theme-tag">{s.theme}</span>
          {s.portfolio && <span className="t-flag pv">EDF PV portfolio</span>}
          {s.nda && <span className="t-flag nda">NDA signed</span>}
          {s.avoid && <span className="t-flag av">Avoid</span>}
        </div>
      )}
    </div>
  );

  // ── Edit view ──────────────────────────────────────────────────
  if (editing) {
    const F = ({ label, children, full }) => (
      <div style={{ display:'flex', flexDirection:'column', gap:4, gridColumn: full ? '1/-1' : undefined }}>
        <div style={{ fontSize:10, fontWeight:700, textTransform:'uppercase', letterSpacing:'0.5px', color:'var(--edf-grey-500)' }}>{label}</div>
        {children}
      </div>
    );
    const inp = {
      border: '1px solid var(--edf-grey-200)', borderRadius:6, padding:'7px 9px',
      fontSize:12, background:'var(--edf-grey-100)', outline:'none', width:'100%',
      fontFamily:'inherit',
    };
    const focusStyle = e => e.target.style.borderColor = 'var(--edf-blue-medium)';
    const blurStyle  = e => e.target.style.borderColor = 'var(--edf-grey-200)';

    return (
      <>
        <div className="drawer-scrim" onClick={() => setEditing(false)}/>
        <aside className="drawer">
          {drawerHead}
          <div className="dr-body">
            {editMsg && <div className={`form-msg form-${editMsg.type}`} style={{ marginBottom:14 }}>{editMsg.text}</div>}

            {/* ── Description ── */}
            <F label="Description" full>
              <textarea value={form.description} onChange={e=>set('description',e.target.value)}
                rows={3} style={{ ...inp, resize:'vertical' }} onFocus={focusStyle} onBlur={blurStyle}
                placeholder="What does this company do?"/>
            </F>

            {/* ── 2-col grid ── */}
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'12px 16px', marginTop:14 }}>

              <F label="Category">
                <input value={form.category} onChange={e=>set('category',e.target.value)}
                  style={inp} onFocus={focusStyle} onBlur={blurStyle} placeholder="e.g. Battery Storage"/>
              </F>

              <F label="Country">
                <input value={form.country} onChange={e=>set('country',e.target.value)}
                  style={inp} onFocus={focusStyle} onBlur={blurStyle} placeholder="e.g. UK"/>
              </F>

              <F label="Status">
                <select value={form.status} onChange={e=>set('status',e.target.value)}
                  style={{ ...inp, cursor:'pointer' }} onFocus={focusStyle} onBlur={blurStyle}>
                  {REAL_STATUSES.map(st => <option key={st} value={st}>{st}</option>)}
                </select>
              </F>

              <F label="Status comment">
                <input value={form.status_comment} onChange={e=>set('status_comment',e.target.value)}
                  style={inp} onFocus={focusStyle} onBlur={blurStyle} placeholder="Brief context…"/>
              </F>

              <F label="Website" full>
                <input value={form.website} onChange={e=>set('website',e.target.value)}
                  style={inp} onFocus={focusStyle} onBlur={blurStyle} placeholder="https://…"/>
              </F>

              <F label="Key contact">
                <input value={form.key_contact} onChange={e=>set('key_contact',e.target.value)}
                  style={inp} onFocus={focusStyle} onBlur={blurStyle} placeholder="Full name"/>
              </F>

              <F label="Contact email">
                <input type="email" value={form.key_contact_email} onChange={e=>set('key_contact_email',e.target.value)}
                  style={inp} onFocus={focusStyle} onBlur={blurStyle} placeholder="name@company.com"/>
              </F>

              <F label="Relationship owner">
                <input value={form.relationship_owner} onChange={e=>set('relationship_owner',e.target.value)}
                  style={inp} onFocus={focusStyle} onBlur={blurStyle} placeholder="EDF lead"/>
              </F>

              <F label="Added by">
                <input value={form.added_by} onChange={e=>set('added_by',e.target.value)}
                  style={inp} onFocus={focusStyle} onBlur={blurStyle} placeholder="Your name"/>
              </F>
            </div>

            {/* ── Business units ── */}
            <div style={{ marginTop:14 }}>
              <div style={{ fontSize:10, fontWeight:700, textTransform:'uppercase', letterSpacing:'0.5px', color:'var(--edf-grey-500)', marginBottom:6 }}>Business unit</div>
              <div style={{ display:'flex', flexWrap:'wrap', gap:6 }}>
                {BU_OPTIONS.map(bu => {
                  const on = form.business_units.includes(bu);
                  return (
                    <button key={bu} type="button" onClick={() => toggleBU(bu)}
                      style={{
                        padding:'4px 10px', borderRadius:999, fontSize:11, fontWeight:600, cursor:'pointer',
                        border: on ? '1.5px solid var(--edf-blue-deep)' : '1.5px solid var(--edf-grey-200)',
                        background: on ? 'var(--edf-blue-deep)' : 'transparent',
                        color: on ? '#fff' : 'var(--edf-grey-700)',
                      }}>{bu}</button>
                  );
                })}
              </div>
            </div>

            {/* ── Flags ── */}
            <div style={{ marginTop:14 }}>
              <div style={{ fontSize:10, fontWeight:700, textTransform:'uppercase', letterSpacing:'0.5px', color:'var(--edf-grey-500)', marginBottom:6 }}>Flags</div>
              <div style={{ display:'flex', gap:8 }}>
                {[
                  { key:'edf_pv', label:'EDF PV portfolio' },
                  { key:'nda',    label:'NDA signed' },
                  { key:'avoid',  label:'Avoid', danger:true },
                ].map(({ key, label, danger }) => {
                  const on = form[key] === 'Yes';
                  return (
                    <button key={key} type="button" onClick={() => set(key, on ? 'No' : 'Yes')}
                      style={{
                        padding:'4px 12px', borderRadius:999, fontSize:11, fontWeight:600, cursor:'pointer',
                        border: on ? `1.5px solid ${danger ? '#dc2626' : 'var(--edf-orange-deep)'}` : '1.5px solid var(--edf-grey-200)',
                        background: on ? (danger ? '#dc2626' : 'var(--edf-orange-deep)') : 'transparent',
                        color: on ? '#fff' : 'var(--edf-grey-700)',
                      }}>{on ? '✓ ' : ''}{label}</button>
                  );
                })}
              </div>
            </div>

            {/* ── Actions ── */}
            <div style={{ display:'flex', gap:8, marginTop:20, justifyContent:'flex-end' }}>
              <button className="btn-ghost btn-sm" onClick={() => setEditing(false)}>Cancel</button>
              <button className="btn-primary btn-sm" onClick={saveEdit}
                disabled={editSaving} style={{ opacity: editSaving ? 0.6 : 1 }}>
                {editSaving ? 'Saving…' : 'Save changes'}
              </button>
            </div>
          </div>
        </aside>
      </>
    );
  }

  // ── Read view ──────────────────────────────────────────────────
  return (
    <>
      <div className="drawer-scrim" onClick={onClose}/>
      <aside className="drawer">
        {drawerHead}

        <div className="dr-body">
          {s.desc && <p className="dr-desc">{s.desc}</p>}
          {s.statusComment && <p className="dr-status-comment">{s.statusComment}</p>}

          {/* ── Similar startups ── */}
          {similarStartups.length > 0 && (
            <>
              <h3 className="dr-h3">Similar in database
                <span style={{ marginLeft:6, fontSize:10, fontWeight:700, background:'var(--edf-grey-200)',
                  color:'var(--edf-grey-600)', borderRadius:999, padding:'1px 6px', verticalAlign:'middle' }}>
                  {similarStartups.length}
                </span>
              </h3>
              <div style={{ display:'flex', flexDirection:'column', gap:1, marginBottom:16,
                border:'1px solid var(--edf-grey-200)', borderRadius:8, overflow:'hidden' }}>
                {similarStartups.map((sim, idx) => {
                  const ss = STATUS_STYLE[sim.status] || STATUS_STYLE['No contact'];
                  const isAiLinked = sim.addedBy && sim.addedBy.toLowerCase().includes('similar to ' + s.name.toLowerCase());
                  return (
                    <button key={sim.id} onClick={() => onPick && onPick(sim)}
                      style={{ display:'flex', alignItems:'center', gap:10, padding:'8px 12px',
                        background: idx % 2 === 0 ? '#fff' : 'var(--edf-grey-50)',
                        border:'none', borderTop: idx > 0 ? '1px solid var(--edf-grey-100)' : 'none',
                        cursor:'pointer', textAlign:'left', width:'100%' }}
                      onMouseEnter={e => e.currentTarget.style.background='var(--edf-blue-tint,#EEF4FF)'}
                      onMouseLeave={e => e.currentTarget.style.background= idx % 2 === 0 ? '#fff' : 'var(--edf-grey-50)'}>
                      <StartupMark name={sim.name} theme={sim.theme} size={28}/>
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontSize:12, fontWeight:700, color:'var(--edf-black)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
                          {sim.name}
                          {isAiLinked && <span title="Found via AI 'Find similar'" style={{ marginLeft:5, fontSize:9, color:'var(--edf-orange-deep)', fontWeight:800, letterSpacing:'0.3px' }}>AI</span>}
                        </div>
                        <div style={{ fontSize:10, color:'var(--edf-grey-500)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
                          {[sim.category !== 'Uncategorised' ? sim.category : null, sim.country !== '—' ? sim.country : null].filter(Boolean).join(' · ')}
                        </div>
                      </div>
                      <span style={{ fontSize:10, fontWeight:700, padding:'2px 7px', borderRadius:999,
                        background: ss.bg, color: ss.color, whiteSpace:'nowrap', flexShrink:0 }}>
                        {sim.status}
                      </span>
                    </button>
                  );
                })}
              </div>
            </>
          )}

          <dl className="dr-grid">
            {s.bu.length > 0 && <div><dt>Business unit</dt><dd>{s.bu.join(', ')}</dd></div>}
            {s.relOwner !== '—' && <div><dt>Relationship owner</dt><dd>{s.relOwner}</dd></div>}
            {s.addedBy !== '—' && <div><dt>Added by</dt><dd>{s.addedBy}</dd></div>}
            {s.lastTouch && <div><dt>Last activity</dt><dd>{fmtDate(s.lastTouch)}</dd></div>}
            {s.website && (
              <div><dt>Website</dt><dd>
                <a href={s.website.startsWith('http') ? s.website : `https://${s.website}`} target="_blank" rel="noopener noreferrer">
                  {s.website} <IcoExternal size={10}/>
                </a>
              </dd></div>
            )}
          </dl>

          {s.contact !== '—' && (
            <>
              <h3 className="dr-h3">Key contact</h3>
              <div className="dr-contact">
                <div className="dr-c-av">{cInitials}</div>
                <div>
                  <div className="dr-c-nm">{s.contact}</div>
                  {s.contactEmail && <div className="dr-c-em">{s.contactEmail}</div>}
                </div>
                {s.contactEmail && (
                  <a href={`mailto:${s.contactEmail}`} className="dr-c-cta">Email <IcoArrowUR size={11}/></a>
                )}
              </div>
            </>
          )}

          <h3 className="dr-h3">Notes &amp; activity</h3>
          <textarea className="dr-note-input" placeholder="Add a note…"
            value={noteText} onChange={e => setNoteText(e.target.value)}/>
          <div className="dr-note-actions">
            <button className="btn-primary btn-sm" onClick={saveNote}
              disabled={noteSaving || !noteText.trim()} style={{ opacity: noteSaving || !noteText.trim() ? 0.5 : 1 }}>
              {noteSaving ? 'Saving…' : 'Save note'}
            </button>
          </div>

          {updates.length > 0 ? (
            <ul className="dr-timeline">
              {updates.map((u, i) => (
                <li key={i}>
                  <span className="tl-dot"/>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontSize:12 }}>{u.text}</div>
                    <div className="dr-note-meta">{u.date && fmtDate(u.date)}{u.author ? ` · ${u.author}` : ''}</div>
                  </div>
                  <button onClick={() => deleteNote(i)} title="Delete note"
                    style={{ background:'none', border:'none', color:'var(--edf-grey-300)', padding:'0 4px', cursor:'pointer', flexShrink:0 }}
                    onMouseEnter={e => e.currentTarget.style.color='#dc2626'}
                    onMouseLeave={e => e.currentTarget.style.color='var(--edf-grey-300)'}>
                    <IcoTrash size={13}/>
                  </button>
                </li>
              ))}
            </ul>
          ) : (
            <p style={{ fontSize:12, color:'var(--edf-grey-500)', fontStyle:'italic' }}>No notes yet.</p>
          )}

          {/* ── Portfolios ── */}
          {Object.keys(collections).length > 0 && (
            <>
              <h3 className="dr-h3">Portfolios</h3>
              <div style={{ display:'flex', flexWrap:'wrap', gap:6, marginBottom:16 }}>
                {Object.entries(collections).map(([name, col], idx) => {
                  const inCol = (col.startups || []).includes(s.name);
                  const busy  = colToggles[name];
                  const color = portfolioColor(name, idx);
                  return (
                    <button key={name} onClick={() => !busy && toggleCol(name)}
                      style={{
                        display:'inline-flex', alignItems:'center', gap:5,
                        padding:'4px 10px', borderRadius:999,
                        border: inCol ? `1.5px solid ${color}` : '1.5px solid var(--edf-grey-200)',
                        background: inCol ? color : 'transparent',
                        color: inCol ? '#fff' : 'var(--edf-grey-700)',
                        fontSize:11, fontWeight:600, cursor: busy ? 'wait' : 'pointer', opacity: busy ? 0.6 : 1,
                      }}>
                      {inCol ? '✓ ' : '+ '}{name}
                    </button>
                  );
                })}
              </div>
            </>
          )}

          <div className="dr-actions">
            <select className="status-select" value={s.status} onChange={e => onStatusChange(s.name, e.target.value)}>
              {REAL_STATUSES.map(st => <option key={st} value={st}>{st}</option>)}
            </select>
            <button className="btn-ghost btn-sm" onClick={onClose}>Close</button>
          </div>
        </div>
      </aside>
    </>
  );
}

// ─── Add/Edit Venture Modal ──────────────────────────────────────
function VentureModal({ existing, onClose, onSaved }) {
  const isEdit = !!existing;
  const s = existing;
  const [form, setForm] = useState({
    name: s?.name || '',
    category: s?.category || '',
    status: s?.status || REAL_STATUSES[0],
    country: s?.country || '',
    description: s?.desc || '',
    status_comment: s?.statusComment || '',
    website: s?.website || '',
    added_by: s?.addedBy || '',
    key_contact: s?.contact || '',
    key_contact_email: s?.contactEmail || '',
    relationship_owner: s?.relOwner || '',
    avoid: s?.avoid ? 'Yes' : 'No',
    edf_pv: s?.portfolio ? 'Yes' : 'No',
    nda: s?.nda ? 'Yes' : 'No',
    business_units: s?.bu || [],
  });
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState(null);

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const toggleBU = bu => {
    const next = form.business_units.includes(bu)
      ? form.business_units.filter(x => x !== bu)
      : [...form.business_units, bu];
    set('business_units', next);
  };

  const submit = async (e) => {
    e.preventDefault();
    if (!form.name.trim()) { setMsg({ type: 'error', text: 'Company name is required.' }); return; }
    setSaving(true); setMsg(null);
    try {
      const url = isEdit ? '/api/startups/edit' : '/api/startups/add';
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...form, name: form.name.trim() }),
      });
      const j = await res.json();
      if (j.ok) {
        setMsg({ type: 'success', text: isEdit ? 'Saved.' : `"${form.name}" added.` });
        if (onSaved) onSaved();
        if (!isEdit) setTimeout(onClose, 1200);
      } else {
        setMsg({ type: 'error', text: j.error || 'Something went wrong.' });
      }
    } catch { setMsg({ type: 'error', text: 'Network error.' }); }
    finally { setSaving(false); }
  };

  return (
    <div className="modal-scrim" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal-card">
        <div className="modal-head">
          <h2>{isEdit ? 'Edit venture' : 'Add a venture'}</h2>
          <p>{isEdit ? `Editing ${s.name}.` : 'Capture a new clean-tech startup.'}</p>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <form onSubmit={submit}>
          <div className="modal-body">
            {msg && <div className={`form-msg form-${msg.type}`}>{msg.text}</div>}

            <div>
              <div className="form-section-title">Company details</div>
              <div className="form-grid">
                <label className="full"><span>Company name *</span>
                  <input value={form.name} onChange={e => set('name', e.target.value)} placeholder="e.g. Aerleum" disabled={isEdit}/></label>
                <label><span>Category</span>
                  <input value={form.category} onChange={e => set('category', e.target.value)} placeholder="e.g. Battery Storage"/></label>
                <label><span>Country</span>
                  <input value={form.country} onChange={e => set('country', e.target.value)} placeholder="e.g. UK"/></label>
                <label><span>Website</span>
                  <input value={form.website} onChange={e => set('website', e.target.value)} placeholder="https://…"/></label>
                <label className="full"><span>Description</span>
                  <textarea rows="2" value={form.description} onChange={e => set('description', e.target.value)} placeholder="One or two sentences…"/></label>
              </div>
            </div>

            <div>
              <div className="form-section-title">Relationship</div>
              <div className="form-grid">
                <label><span>Status</span>
                  <select value={form.status} onChange={e => set('status', e.target.value)}>
                    {REAL_STATUSES.map(st => <option key={st} value={st}>{st}</option>)}
                  </select></label>
                <label><span>Status comment</span>
                  <input value={form.status_comment} onChange={e => set('status_comment', e.target.value)} placeholder="Brief context…"/></label>
                <label><span>Relationship owner</span>
                  <input value={form.relationship_owner} onChange={e => set('relationship_owner', e.target.value)} placeholder="EDF lead name"/></label>
                <label><span>Added by</span>
                  <input value={form.added_by} onChange={e => set('added_by', e.target.value)} placeholder="Your name"/></label>
                <label><span>Contact name</span>
                  <input value={form.key_contact} onChange={e => set('key_contact', e.target.value)} placeholder="Full name"/></label>
                <label><span>Contact email</span>
                  <input type="email" value={form.key_contact_email} onChange={e => set('key_contact_email', e.target.value)} placeholder="name@company.com"/></label>
              </div>
            </div>

            <div>
              <div className="form-section-title">Business unit</div>
              <div className="chk-row">
                {BU_OPTIONS.map(bu => (
                  <label key={bu} className="chk">
                    <input type="checkbox" checked={form.business_units.includes(bu)} onChange={() => toggleBU(bu)}/> {bu}
                  </label>
                ))}
              </div>
            </div>

            <div>
              <div className="form-section-title">Flags</div>
              <div className="chk-row">
                <label className="chk"><input type="checkbox" checked={form.edf_pv === 'Yes'} onChange={e => set('edf_pv', e.target.checked ? 'Yes' : 'No')}/> EDF PV portfolio</label>
                <label className="chk"><input type="checkbox" checked={form.nda === 'Yes'} onChange={e => set('nda', e.target.checked ? 'Yes' : 'No')}/> NDA signed</label>
                <label className="chk"><input type="checkbox" checked={form.avoid === 'Yes'} onChange={e => set('avoid', e.target.checked ? 'Yes' : 'No')}/> Mark as avoid</label>
              </div>
            </div>
          </div>
          <div className="modal-actions">
            <button type="button" className="btn-ghost btn-sm" onClick={onClose}>Cancel</button>
            <button type="submit" className="btn-primary btn-sm" disabled={saving} style={{ opacity: saving ? 0.6 : 1 }}>
              {saving ? 'Saving…' : (isEdit ? 'Save changes' : 'Add venture')}
            </button>
          </div>
        </form>
      </div>
    </div>
  );
}

// ─── New Portfolio Modal ─────────────────────────────────────────
function NewPortfolioModal({ onClose, onCreated }) {
  const [name, setName] = useState('');
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState('');

  const submit = async (e) => {
    e.preventDefault();
    if (!name.trim()) { setErr('Name is required.'); return; }
    setSaving(true); setErr('');
    const res = await fetch('/api/collections/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name.trim() }),
    });
    const j = await res.json();
    setSaving(false);
    if (j.ok) { onCreated(); onClose(); }
    else setErr(j.error || 'Could not create portfolio.');
  };

  return (
    <div className="modal-scrim" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal-card" style={{ maxWidth: 420 }}>
        <div className="modal-head">
          <h2>New portfolio</h2>
          <p>Group ventures into a named collection you can share with colleagues.</p>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <form onSubmit={submit}>
          <div className="modal-body">
            {err && <div className="form-msg form-error">{err}</div>}
            <label style={{ display:'flex', flexDirection:'column', gap:6, fontSize:12, fontWeight:600, color:'var(--edf-grey-700)' }}>
              Portfolio name
              <input
                autoFocus
                value={name}
                onChange={e => setName(e.target.value)}
                placeholder="e.g. UK Heat Pilots Q2"
                style={{ border:'1px solid var(--edf-grey-200)', borderRadius:8, padding:'9px 11px', fontSize:13, outline:'none', background:'var(--edf-grey-100)' }}
                onFocus={e => e.target.style.borderColor='var(--edf-blue-medium)'}
                onBlur={e => e.target.style.borderColor='var(--edf-grey-200)'}
              />
            </label>
          </div>
          <div className="modal-actions">
            <button type="button" className="btn-ghost btn-sm" onClick={onClose}>Cancel</button>
            <button type="submit" className="btn-primary btn-sm" disabled={saving} style={{ opacity: saving ? 0.6 : 1 }}>
              {saving ? 'Creating…' : 'Create portfolio'}
            </button>
          </div>
        </form>
      </div>
    </div>
  );
}

// ─── Manage Portfolio Modal ──────────────────────────────────────
function ManagePortfolioModal({ name, col, startups, knownUsers, onClose, onChanged, onDeleted }) {
  const [editName, setEditName] = useState(name);
  const [memberInput, setMemberInput] = useState('');
  const [members, setMembers] = useState(col.members || []);
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState(null);

  const colStartups = useMemo(() =>
    startups.filter(s => (col.startups || []).includes(s.name)),
    [startups, col]
  );

  const saveName = async () => {
    const trimmed = editName.trim();
    if (!trimmed || trimmed === name) return;
    setSaving(true);
    const res = await fetch('/api/collections/rename', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ old_name: name, new_name: trimmed }),
    });
    const j = await res.json();
    setSaving(false);
    if (j.ok) { setMsg({ type:'success', text:'Renamed.' }); onChanged(trimmed); }
    else setMsg({ type:'error', text: j.error || 'Could not rename.' });
  };

  const saveMembers = async (newList) => {
    setMembers(newList);
    await fetch('/api/collections/members', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ collection: editName.trim() || name, members: newList }),
    });
    onChanged(editName.trim() || name);
  };

  const addMember = () => {
    const v = memberInput.trim();
    if (!v || members.includes(v)) { setMemberInput(''); return; }
    saveMembers([...members, v]);
    setMemberInput('');
  };

  const removeMember = (m) => saveMembers(members.filter(x => x !== m));

  const removeStartup = async (startupName) => {
    await fetch('/api/collections/remove', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ collection: editName.trim() || name, startup: startupName }),
    });
    onChanged(editName.trim() || name);
  };

  const deletePortfolio = async () => {
    if (!confirm(`Delete portfolio "${name}"? This cannot be undone.`)) return;
    await fetch('/api/collections/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name }),
    });
    onDeleted();
    onClose();
  };

  const suggestions = knownUsers.filter(u => !members.includes(u) && u.toLowerCase().includes(memberInput.toLowerCase()));

  return (
    <div className="modal-scrim" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal-card" style={{ maxWidth: 520 }}>
        <div className="modal-head">
          <h2>Manage portfolio</h2>
          <p>Rename, update members, or remove ventures.</p>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          {msg && <div className={`form-msg form-${msg.type}`}>{msg.text}</div>}

          {/* Name */}
          <div>
            <div className="form-section-title">Portfolio name</div>
            <div style={{ display:'flex', gap:8 }}>
              <input
                value={editName}
                onChange={e => setEditName(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && saveName()}
                style={{ flex:1, border:'1px solid var(--edf-grey-200)', borderRadius:8, padding:'8px 10px', fontSize:12, outline:'none', background:'var(--edf-grey-100)' }}
                onFocus={e => e.target.style.borderColor='var(--edf-blue-medium)'}
                onBlur={e => e.target.style.borderColor='var(--edf-grey-200)'}
              />
              <button className="btn-primary btn-sm" onClick={saveName} disabled={saving || editName.trim() === name}>
                Rename
              </button>
            </div>
          </div>

          {/* Members */}
          <div>
            <div className="form-section-title">Team members</div>
            <div style={{ display:'flex', flexWrap:'wrap', gap:6, marginBottom:8 }}>
              {members.map(m => (
                <span key={m} style={{ display:'inline-flex', alignItems:'center', gap:5, background:'var(--edf-blue-deep)', color:'#fff', borderRadius:999, padding:'3px 10px', fontSize:11, fontWeight:600 }}>
                  {m}
                  <button onClick={() => removeMember(m)} style={{ background:'none', border:'none', color:'rgba(255,255,255,0.7)', cursor:'pointer', padding:'0 0 0 2px', fontSize:13, lineHeight:1 }}>×</button>
                </span>
              ))}
              {members.length === 0 && <span style={{ fontSize:11, color:'var(--edf-grey-500)', fontStyle:'italic' }}>No members yet.</span>}
            </div>
            <div style={{ position:'relative' }}>
              <div style={{ display:'flex', gap:8 }}>
                <input
                  value={memberInput}
                  onChange={e => setMemberInput(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && addMember()}
                  placeholder="Type a name and press Enter…"
                  style={{ flex:1, border:'1px solid var(--edf-grey-200)', borderRadius:8, padding:'8px 10px', fontSize:12, outline:'none', background:'var(--edf-grey-100)' }}
                  onFocus={e => e.target.style.borderColor='var(--edf-blue-medium)'}
                  onBlur={e => e.target.style.borderColor='var(--edf-grey-200)'}
                />
                <button className="btn-ghost btn-sm" onClick={addMember}>Add</button>
              </div>
              {memberInput.length > 0 && suggestions.length > 0 && (
                <div style={{ position:'absolute', top:'calc(100% + 4px)', left:0, right:0, background:'#fff', border:'1px solid var(--edf-grey-200)', borderRadius:8, boxShadow:'var(--shadow-md)', zIndex:60, overflow:'hidden' }}>
                  {suggestions.slice(0,6).map(u => (
                    <button key={u} onClick={() => { saveMembers([...members, u]); setMemberInput(''); }}
                      style={{ display:'block', width:'100%', textAlign:'left', padding:'8px 12px', fontSize:12, border:'none', background:'transparent', cursor:'pointer' }}
                      onMouseEnter={e=>e.currentTarget.style.background='var(--edf-grey-100)'}
                      onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                      {u}
                    </button>
                  ))}
                </div>
              )}
            </div>
          </div>

          {/* Ventures */}
          <div>
            <div className="form-section-title">Ventures ({colStartups.length})</div>
            {colStartups.length > 0 ? (
              <div style={{ display:'flex', flexDirection:'column', gap:2, maxHeight:200, overflowY:'auto' }}>
                {colStartups.map(s => (
                  <div key={s.id} style={{ display:'flex', alignItems:'center', gap:8, padding:'5px 8px', borderRadius:6, background:'var(--edf-grey-100)' }}>
                    <StartupMark name={s.name} theme={s.theme} size={20}/>
                    <span style={{ flex:1, fontSize:12, fontWeight:600 }}>{s.name}</span>
                    <span style={{ fontSize:10, color:'var(--edf-grey-500)' }}>{s.theme}</span>
