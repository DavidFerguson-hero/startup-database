                    <button onClick={() => removeStartup(s.name)} title="Remove from portfolio"
                      style={{ background:'none', border:'none', color:'var(--edf-grey-300)', cursor:'pointer', padding:'2px 4px', fontSize:13 }}
                      onMouseEnter={e=>e.currentTarget.style.color='#dc2626'}
                      onMouseLeave={e=>e.currentTarget.style.color='var(--edf-grey-300)'}>×</button>
                  </div>
                ))}
              </div>
            ) : (
              <p style={{ fontSize:11, color:'var(--edf-grey-500)', fontStyle:'italic' }}>
                No ventures yet — open a company's profile and add it to this portfolio.
              </p>
            )}
          </div>
        </div>
        <div className="modal-actions" style={{ justifyContent:'space-between' }}>
          <button className="btn-ghost btn-sm" onClick={deletePortfolio} style={{ color:'#dc2626', borderColor:'#fca5a5' }}>
            Delete portfolio
          </button>
          <button className="btn-primary btn-sm" onClick={onClose}>Done</button>
        </div>
      </div>
    </div>
  );
}

// ─── Root App ────────────────────────────────────────────────────
function App() {
  const [startups, setStartups] = useState([]);
  const [loading, setLoading] = useState(true);
  const [collections, setCollections] = useState({});   // { name: { startups, members, created_by } }
  const [knownUsers, setKnownUsers] = useState([]);
  const [q, setQ] = useState('');
  const [activeView, setActiveView] = useState('all');
  const [filters, setFilters] = useState({ status: [], theme: [], bu: [], country: [] });
  const [sortBy, setSortBy] = useState('lastTouch');
  const [picked, setPicked] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [showNewPortfolio, setShowNewPortfolio] = useState(false);
  const [managePortfolio, setManagePortfolio] = useState(null);   // portfolio name string

  const loadCollections = useCallback(() => {
    fetch('/api/collections').then(r => r.json()).then(setCollections).catch(() => {});
  }, []);

  useEffect(() => {
    Promise.all([
      fetch('/api/startups').then(r => r.json()),
      fetch('/api/collections').then(r => r.json()),
      fetch('/api/users').then(r => r.json()).catch(() => []),
    ]).then(([sv, cols, users]) => {
      setStartups(sv.map(normalizeStartup));
      setCollections(cols);
      setKnownUsers(users);
      setLoading(false);
    }).catch(() => setLoading(false));
  }, []);

  const reload = useCallback(() => {
    fetch('/api/startups').then(r => r.json()).then(data => setStartups(data.map(normalizeStartup)));
  }, []);

  const handleStatusChange = async (name, status) => {
    await fetch('/api/status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, status }),
    });
    setStartups(prev => prev.map(s => s.id === name ? { ...s, status } : s));
    if (picked && picked.id === name) setPicked(p => ({ ...p, status }));
  };

  const viewFilter = useMemo(() => {
    if (activeView === 'all') return () => true;
    const col = collections[activeView];
    if (!col) return () => true;
    const set = new Set(col.startups || []);
    return s => set.has(s.name);
  }, [activeView, collections]);

  const viewName = useMemo(() => {
    if (activeView === 'all') return 'Whole database';
    return collections[activeView] ? activeView : 'Whole database';
  }, [activeView, collections]);

  const allThemes = useMemo(() => [...new Set(startups.map(s => s.theme))].filter(Boolean).sort(), [startups]);
  const allCountries = useMemo(() => [...new Set(startups.map(s => s.country))].filter(c => c && c !== '—').sort(), [startups]);

  const data = useMemo(() => {
    let d = startups.filter(viewFilter).filter(s => {
      if (q && !`${s.name} ${s.category} ${s.desc} ${s.country} ${s.theme}`.toLowerCase().includes(q.toLowerCase())) return false;
      if (filters.status.length && !filters.status.includes(s.status)) return false;
      if (filters.theme.length && !filters.theme.includes(s.theme)) return false;
      if (filters.bu.length && !filters.bu.some(b => s.bu.includes(b))) return false;
      if (filters.country.length && !filters.country.includes(s.country)) return false;
      return true;
    });
    d = [...d].sort((a, b) => {
      if (sortBy === 'lastTouch') return (b.lastTouch || '').localeCompare(a.lastTouch || '');
      if (sortBy === 'name') return a.name.localeCompare(b.name);
      if (sortBy === 'status') return a.status.localeCompare(b.status);
      if (sortBy === 'theme') return a.theme.localeCompare(b.theme);
      if (sortBy === 'country') return a.country.localeCompare(b.country);
      if (sortBy === 'relOwner') return a.relOwner.localeCompare(b.relOwner);
      return 0;
    });
    return d;
  }, [startups, viewFilter, q, filters, sortBy]);

  if (loading) return (
    <div className="loading-screen">
      <img src="/static/edf-logo.png" alt="EDF" style={{ height: 36, width: 'auto', display: 'block' }}/>
      <div className="loading-spinner"/>
      <span style={{ fontSize: 13, color: 'var(--edf-grey-500)' }}>Loading ventures…</span>
    </div>
  );

  const now = new Date();
  const syncTime = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  const countries = new Set(startups.map(s => s.country).filter(c => c && c !== '—')).size;

  return (
    <div>
      {/* ── Nav ── */}
      <header className="app-nav">
        <a className="nav-logo" href="/"><EdfLogo height={28}/></a>
        <span className="nav-sep"/>
        <span className="nav-product"><IcoBolt size={13}/> Startups Database</span>
        <div className="nav-r">
          <div className="nav-search-pill" onClick={() => document.querySelector('.search-pill input')?.focus()}>
            <IcoSearch size={13}/> Search ventures…<kbd>⌘K</kbd>
          </div>
          <button className="nav-add" onClick={() => setShowAdd(true)}>
            <IcoPlus size={13}/> Add venture
          </button>
          <div className="nav-acct" title="EDF Scouting">EDF</div>
        </div>
      </header>

      {/* ── Stat stripe ── */}
      <StatStripe startups={startups}/>

      {/* ── Main grid ── */}
      <div className="cc-grid">
        <LeftRail
          startups={startups}
          collections={collections}
          activeView={activeView}
          setActiveView={setActiveView}
          onPick={s => setPicked(s)}
          onAddClick={() => setShowAdd(true)}
          onNewPortfolio={() => setShowNewPortfolio(true)}
          onManagePortfolio={name => setManagePortfolio(name)}
        />
        <div className="cc-main">
          <Toolbar
            q={q} setQ={setQ}
            filters={filters} setFilters={setFilters}
            viewName={viewName} count={data.length}
            allThemes={allThemes} allCountries={allCountries}
            onAddClick={() => setShowAdd(true)}
          />
          <DenseTable
            data={data}
            picked={picked}
            onPick={s => setPicked(s)}
            sortBy={sortBy}
            setSortBy={setSortBy}
          />
        </div>
      </div>

      {/* ── Footer ── */}
      <div className="app-footer">
        <span className="ftr-live">Live · synced {syncTime}</span>
        <span className="ftr-sep"/>
        <span>{startups.length} ventures · {countries} countries</span>
        <span className="ftr-sep"/>
        <span>Viewing: {viewName} ({data.length})</span>
        <span style={{ marginLeft: 'auto' }}>EDF UK · Innovation Scouting</span>
      </div>

      {/* ── Detail drawer ── */}
      {picked && (
        <DetailDrawer
          s={picked}
          onClose={() => setPicked(null)}
          onStatusChange={handleStatusChange}
          collections={collections}
          onCollectionsChange={loadCollections}
          allStartups={startups}
          onPick={s => setPicked(s)}
          onStartupSaved={() => {
            reload();
            // Refresh picked so display view reflects saved changes
            fetch('/api/startups')
              .then(r => r.json())
              .then(data => {
                const updated = data.map(normalizeStartup).find(x => x.id === picked.id);
                if (updated) setPicked({ ...updated, updates: picked.updates });
              });
          }}
        />
      )}

      {/* ── Add venture modal ── */}
      {showAdd && (
        <VentureModal
          onClose={() => setShowAdd(false)}
          onSaved={reload}
        />
      )}

      {/* ── New portfolio modal ── */}
      {showNewPortfolio && (
        <NewPortfolioModal
          onClose={() => setShowNewPortfolio(false)}
          onCreated={loadCollections}
        />
      )}

      {/* ── Manage portfolio modal ── */}
      {managePortfolio && collections[managePortfolio] && (
        <ManagePortfolioModal
          name={managePortfolio}
          col={collections[managePortfolio]}
          startups={startups}
          knownUsers={knownUsers}
          onClose={() => setManagePortfolio(null)}
          onChanged={(newName) => { loadCollections(); setManagePortfolio(newName); if (activeView === managePortfolio) setActiveView(newName); }}
          onDeleted={() => { loadCollections(); if (activeView === managePortfolio) setActiveView('all'); }}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
{% endraw %}
</script>
</body>
