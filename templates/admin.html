<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Startup Database — Admin</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f172a; --surface: #1e293b; --surface2: #263348;
    --border: #334155; --text: #f1f5f9; --muted: #94a3b8;
    --primary: #38bdf8; --danger: #f87171; --success: #86efac;
    --warning: #fbbf24; --radius: 8px;
  }
  body { background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh; }
  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 24px; height: 56px; display: flex; align-items: center;
    justify-content: space-between; gap: 16px;
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 1rem; font-weight: 700; color: var(--primary); white-space: nowrap; }
  .back-link { font-size: 0.82rem; color: var(--muted); text-decoration: none; }
  .back-link:hover { color: var(--text); }
  .header-right { display: flex; align-items: center; gap: 12px; font-size: 0.82rem; color: var(--muted); }
  .header-right a { color: var(--primary); text-decoration: none; }
  .header-right a:hover { text-decoration: underline; }
  main { max-width: 1000px; margin: 32px auto; padding: 0 24px; }
  h2 { font-size: 1rem; font-weight: 600; margin-bottom: 16px; }
  .stats { display: flex; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 20px; min-width: 120px; }
  .stat .val { font-size: 1.6rem; font-weight: 700; color: var(--primary); }
  .stat .lbl { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  thead th {
    text-align: left; padding: 10px 12px; color: var(--muted); font-weight: 500;
    font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em;
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:hover { background: var(--surface2); }
  tbody td { padding: 10px 12px; vertical-align: middle; }
  .badge {
    display: inline-flex; align-items: center; padding: 2px 8px;
    border-radius: 99px; font-size: 0.72rem; font-weight: 600; white-space: nowrap;
  }
  .badge.admin   { background: #312e8122; color: #a78bfa; border: 1px solid #312e8144; }
  .badge.user    { background: #0c4a6e22; color: #7dd3fc; border: 1px solid #0c4a6e44; }
  .badge.active  { background: #14532d22; color: #86efac; border: 1px solid #14532d44; }
  .badge.inactive{ background: #7f1d1d22; color: #fca5a5; border: 1px solid #7f1d1d44; }
  .badge.verified  { background: #14532d22; color: #86efac; border: 1px solid #14532d44; }
  .badge.unverified{ background: #78350f22; color: #fcd34d; border: 1px solid #78350f44; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn {
    padding: 4px 10px; border-radius: 6px; font-size: 0.78rem; font-weight: 600;
    cursor: pointer; border: 1px solid var(--border); background: var(--surface2);
    color: var(--text); transition: all 0.15s; white-space: nowrap;
  }
  .btn:hover { border-color: var(--primary); color: var(--primary); }
  .btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .toast {
    position: fixed; bottom: 24px; right: 24px; padding: 10px 16px;
    border-radius: var(--radius); font-size: 0.85rem; font-weight: 500;
    opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 999;
  }
  .toast.show { opacity: 1; }
  .toast.ok  { background: #14532d; color: #86efac; border: 1px solid #166534; }
  .toast.err { background: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; }
  .you { font-size: 0.7rem; color: var(--muted); margin-left: 4px; }
  .email-cell { color: var(--muted); font-size: 0.8rem; }
  .date-cell  { color: var(--muted); font-size: 0.78rem; white-space: nowrap; }
  @media (max-width: 700px) {
    .hide-mobile { display: none; }
    header { padding: 0 12px; }
    main { padding: 0 12px; margin-top: 20px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <a href="/" class="back-link">← Database</a>
    <h1>⚡ User Management</h1>
  </div>
  <div class="header-right">
    <span>{{ current_user.name }}</span>
    <a href="/logout">Sign out</a>
  </div>
</header>

<main>
  <div class="stats" id="stats"></div>
  <h2>All accounts</h2>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Status</th>
        <th class="hide-mobile">Created</th>
        <th class="hide-mobile">Last login</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="user-table-body"></tbody>
  </table>
</main>

<div class="toast" id="toast"></div>

<script>
const ME = '{{ current_user.id }}';
let users = [];

async function load() {
  const res = await fetch('/api/admin/users');
  users = await res.json();
  render();
}

function fmt(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}

function render() {
  const total = users.length;
  const active = users.filter(u => u.active).length;
  const verified = users.filter(u => u.verified).length;
  const admins = users.filter(u => u.role === 'admin').length;
  document.getElementById('stats').innerHTML = [
    ['Total', total], ['Active', active], ['Verified', verified], ['Admins', admins]
  ].map(([l,v]) => `<div class="stat"><div class="val">${v}</div><div class="lbl">${l}</div></div>`).join('');

  document.getElementById('user-table-body').innerHTML = users.map(u => {
    const isMe = u.id === ME;
    return `<tr id="row-${u.id}">
      <td><strong>${esc(u.name)}</strong>${isMe ? '<span class="you">(you)</span>' : ''}</td>
      <td class="email-cell">${esc(u.email)}</td>
      <td><span class="badge ${u.role}">${u.role}</span></td>
      <td>
        <span class="badge ${u.active ? 'active' : 'inactive'}">${u.active ? 'Active' : 'Inactive'}</span>
        <span class="badge ${u.verified ? 'verified' : 'unverified'}" style="margin-left:4px">${u.verified ? 'Verified' : 'Unverified'}</span>
      </td>
      <td class="date-cell hide-mobile">${fmt(u.created_at)}</td>
      <td class="date-cell hide-mobile">${fmt(u.last_login)}</td>
      <td>
        <div class="actions">
          <button class="btn" onclick="toggleActive('${u.id}')" ${isMe ? 'disabled title="Cannot deactivate yourself"' : ''}>
            ${u.active ? 'Deactivate' : 'Activate'}
          </button>
          <button class="btn" onclick="toggleRole('${u.id}')" ${isMe ? 'disabled title="Cannot change your own role"' : ''}>
            ${u.role === 'admin' ? 'Remove admin' : 'Make admin'}
          </button>
          ${!u.verified ? `<button class="btn" onclick="resendVerification('${u.id}')">Resend email</button>` : ''}
          <button class="btn danger" onclick="deleteUser('${u.id}')" ${isMe ? 'disabled title="Cannot delete yourself"' : ''}>Delete</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function api(path, method='POST') {
  const res = await fetch(path, { method });
  return res.json();
}

async function toggleActive(uid) {
  const data = await api(`/api/admin/users/${uid}/toggle-active`);
  if (data.ok) { toast('Updated'); load(); } else { toast(data.error, true); }
}

async function toggleRole(uid) {
  const data = await api(`/api/admin/users/${uid}/toggle-role`);
  if (data.ok) { toast('Updated'); load(); } else { toast(data.error, true); }
}

async function resendVerification(uid) {
  const data = await api(`/api/admin/users/${uid}/resend-verification`);
  if (data.ok) { toast('Verification email sent'); } else { toast(data.error, true); }
}

async function deleteUser(uid) {
  const u = users.find(x => x.id === uid);
  if (!confirm(`Delete account for ${u?.name} (${u?.email})? This cannot be undone.`)) return;
  const data = await api(`/api/admin/users/${uid}`, 'DELETE');
  if (data.ok) { toast('User deleted'); load(); } else { toast(data.error, true); }
}

let _toastTimer;
function toast(msg, isErr=false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast show ${isErr ? 'err' : 'ok'}`;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

load();
</script>
</body>
</html>
