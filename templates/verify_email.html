<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Startup Database — Email Verification</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f172a; --surface: #1e293b; --border: #334155; --text: #f1f5f9;
    --muted: #94a3b8; --primary: #38bdf8; --radius: 8px;
  }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 40px 36px; width: 100%; max-width: 380px;
    display: flex; flex-direction: column; gap: 20px; text-align: center;
  }
  .icon { font-size: 2.5rem; }
  h1 { font-size: 1.15rem; font-weight: 700; color: var(--primary); }
  p { font-size: 0.88rem; color: var(--muted); line-height: 1.6; }
  .btn {
    display: inline-block; background: var(--primary); color: #0f172a; border: none;
    border-radius: var(--radius); padding: 10px 24px; font-size: 0.9rem;
    font-weight: 700; cursor: pointer; text-decoration: none; transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.85; }
  .btn.secondary {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
  }
</style>
</head>
<body>
<div class="card">
  {% if success %}
  <div class="icon">✅</div>
  <h1>Email verified!</h1>
  <p>Your account is now active. You can sign in.</p>
  <a href="/login" class="btn">Sign in →</a>
  {% else %}
  <div class="icon">❌</div>
  <h1>Invalid or expired link</h1>
  <p>This verification link is invalid or has already been used. Please register again or contact an administrator.</p>
  <a href="/register" class="btn">Register</a>
  <a href="/login" class="btn secondary">Sign in</a>
  {% endif %}
</div>
</body>
</html>
