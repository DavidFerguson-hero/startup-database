<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Startup Database — Reset Password</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f172a; --surface: #1e293b; --border: #334155; --text: #f1f5f9;
    --muted: #94a3b8; --primary: #38bdf8; --radius: 8px;
  }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 40px 36px; width: 100%; max-width: 360px;
    display: flex; flex-direction: column; gap: 20px;
  }
  .logo { text-align: center; }
  .logo .icon { font-size: 2rem; }
  .logo h1 { font-size: 1.15rem; font-weight: 700; color: var(--primary); margin-top: 8px; }
  .logo p  { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 0.8rem; color: var(--muted); font-weight: 500; }
  .field input {
    padding: 10px 14px; background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text); font-size: 0.9rem; outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus { border-color: var(--primary); }
  .btn {
    background: var(--primary); color: #0f172a; border: none;
    border-radius: var(--radius); padding: 10px; font-size: 0.9rem;
    font-weight: 700; cursor: pointer; transition: opacity 0.15s; width: 100%;
  }
  .btn:hover { opacity: 0.85; }
  .alert { border-radius: var(--radius); padding: 10px 14px; font-size: 0.82rem; }
  .alert.error   { background: #7f1d1d22; border: 1px solid #7f1d1d66; color: #fca5a5; }
  .alert.success { background: #14532d22; border: 1px solid #14532d66; color: #86efac; }
  .back { text-align: center; font-size: 0.82rem; }
  .back a { color: var(--primary); text-decoration: none; }
  .back a:hover { text-decoration: underline; }
  hr { border: none; border-top: 1px solid var(--border); }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="icon">🔒</div>
    <h1>New Password</h1>
    <p>Choose a new password for your account</p>
  </div>

  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}

  {% if invalid %}
  <div class="alert error">This reset link is invalid or has expired.</div>
  <hr>
  <div class="back"><a href="/forgot-password">Request a new link</a></div>
  {% elif success %}
  <div class="alert success">Password updated. You can now sign in.</div>
  <hr>
  <div class="back"><a href="/login">Sign in →</a></div>
  {% else %}
  <form method="POST" style="display:flex;flex-direction:column;gap:14px">
    <div class="field">
      <label for="password">New password</label>
      <input type="password" id="password" name="password" autofocus
             autocomplete="new-password" placeholder="Min. 8 characters" required minlength="8">
    </div>
    <div class="field">
      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" name="confirm"
             autocomplete="new-password" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn">Set new password →</button>
  </form>
  <hr>
  <div class="back"><a href="/login">← Back to sign in</a></div>
  {% endif %}
</div>
</body>
</html>
