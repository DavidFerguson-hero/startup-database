<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Startup Database — Login</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f172a; --surface: #1e293b; --surface2: #263348;
    --border: #334155; --text: #f1f5f9; --muted: #94a3b8;
    --primary: #38bdf8; --radius: 8px;
  }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 40px 36px; width: 100%; max-width: 360px;
    display: flex; flex-direction: column; gap: 24px;
  }
  .logo { text-align: center; }
  .logo .icon { font-size: 2rem; }
  .logo h1 { font-size: 1.15rem; font-weight: 700; color: var(--primary); margin-top: 8px; }
  .logo p  { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 0.8rem; color: var(--muted); font-weight: 500; }
  .field input {
    padding: 10px 14px; background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text); font-size: 0.9rem; outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus { border-color: var(--primary); }
  .btn {
    background: var(--primary); color: #0f172a; border: none;
    border-radius: var(--radius); padding: 10px; font-size: 0.9rem;
    font-weight: 700; cursor: pointer; transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.85; }
  .error {
    background: #7f1d1d22; border: 1px solid #7f1d1d66;
    border-radius: var(--radius); padding: 10px 14px;
    font-size: 0.82rem; color: #fca5a5; text-align: center;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="icon">⚡</div>
    <h1>Startup Database</h1>
    <p>Enter password to continue</p>
  </div>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="POST">
    <div class="field" style="margin-bottom: 16px">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autofocus autocomplete="current-password" placeholder="••••••••">
    </div>
    <button type="submit" class="btn">Sign in →</button>
  </form>
</div>
</body>
</html>
